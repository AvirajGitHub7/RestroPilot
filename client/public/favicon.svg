<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Frame -->
  <rect width="64" height="64" rx="16" fill="url(#foodGrad)"/>

  <!-- High-Gloss Top Rim Highlight -->
  <path d="M0 16C0 7.163 7.163 0 16 0h32c8.837 0 16 7.163 16 16v4C64 11.163 56.837 4 48 4H16C7.163 4 0 11.163 0 20v-4z" fill="#ffffff" opacity="0.2"/>

  <!-- Restaurant Cloche & Dining Insignia -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Steam / Aroma Swirl -->
    <path d="M28.5 13.5c0-1.8 1.2-3.2 2.5-4 1.5-1 1.8-1.8 1.5-2.5-.5.8-1.8 1.4-2.8 2.3-1.2 1-1.8 2.4-1.2 4.2z" opacity="0.95"/>
    <path d="M35 12.5c0-1.2.8-2.2 1.6-2.8 1-.7 1.2-1.2 1-1.7-.3.5-1.2 1-1.8 1.5-.8.7-1.2 1.6-.8 3z" opacity="0.8"/>

    <!-- Cloche Knob -->
    <circle cx="32" cy="17.5" r="3.2"/>

    <!-- Cloche Dome -->
    <path d="M15 37.5c.3-9 7.8-16.5 17-16.5s16.7 7.5 17 16.5H15z"/>

    <!-- Platter Tray Base -->
    <rect x="12" y="39.5" width="40" height="4.5" rx="2.25"/>
    
    <!-- Under-Tray Stand Accent -->
    <path d="M24 45.5h16c0 1.5-1.5 2.5-3 2.5H27c-1.5 0-3-1-3-2.5z" opacity="0.85"/>

    <!-- Digital QR Dot matrix / Chef spark detail in center of cloche -->
    <rect x="30" y="27" width="4" height="4" rx="1" fill="#f97316"/>
  </g>
</svg>