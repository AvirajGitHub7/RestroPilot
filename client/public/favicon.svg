<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3" flood-color="#000"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="18" fill="url(#grad)"/>

  <!-- Logo Graphics inside -->
  <g filter="url(#shadow)">
    <!-- Pilot Star -->
    <path d="M32 9L34.2 14.5L40 16.5L34.2 18.5L32 24L29.8 18.5L24 16.5L29.8 14.5L32 9Z" fill="#ffffff"/>

    <!-- Cloche Dome -->
    <path d="M14 38C14.5 27 22 20 32 20C42 20 49.5 27 50 38H14Z" fill="#ffffff"/>

    <!-- Aerodynamic Pilot Wing Lines -->
    <path d="M9 39C13 36 18 34.5 24 34.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M55 39C51 36 46 34.5 40 34.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Platter Base -->
    <rect x="11" y="42" width="42" height="4" rx="2" fill="#ffffff"/>

    <!-- Smart Compass Pip -->
    <circle cx="32" cy="31" r="3" fill="#fef08a"/>
  </g>
</svg>